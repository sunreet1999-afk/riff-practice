# Builds PunchLab and publishes GitHub Pages:
#   /riff-practice/           -> the original Riff Practice index.html (unchanged)
#   /riff-practice/punchlab/  -> PunchLab PWA
# Best with Settings -> Pages -> Source: "GitHub Actions". While the source is still
# "Deploy from a branch", GitHub also runs its own "pages build and deployment" on each
# push, which publishes the raw source. The deploy job waits for that run to finish so
# this built site is always the one published last.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: punchlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: punchlab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p _site/punchlab
          cp index.html _site/
          cp -r punchlab/dist/. _site/punchlab/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}punchlab/
    steps:
      - name: Wait for GitHub's branch deployment (if any) to finish first
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          query() {
            gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | first | .status // "none"'
          }
          # The branch build starts within seconds of the push; give it a moment to appear.
          for i in $(seq 1 6); do
            status=$(query || echo none)
            [ "$status" != "none" ] && break
            sleep 5
          done
          if [ "$status" = "none" ]; then
            echo "No branch deployment for this commit; deploying now."
            exit 0
          fi
          for i in $(seq 1 60); do
            status=$(query || echo unknown)
            echo "Branch deployment status: $status"
            [ "$status" = "completed" ] && exit 0
            sleep 5
          done
          echo "Branch deployment still running after 5 minutes; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
